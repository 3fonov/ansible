- name: Installing stow
  community.general.homebrew:
    name: stow
    state: present
  when: (dotfiles_package_manager | default('homebrew')) == 'homebrew'
  tags:
    - install
    - dotfiles
    - stow
- name: Installing stow with APT
  become: true
  ansible.builtin.apt:
    name: stow
    state: present
  when: (dotfiles_package_manager | default('homebrew')) == 'apt'
  tags:
    - install
    - dotfiles
    - stow
- name: Cloning .dotfiles
  ansible.builtin.git:
    repo: 'git@github.com:3fonov/.dotfiles.git'
    dest: "{{ lookup('env', 'HOME') }}/.dotfiles"
    recursive: yes
    update: yes
    accept_hostkey: yes
    version: master
  when: not (dotfiles_clone_with_gh | default(false))
  tags:
    - install
    - dotfiles
    - stow
- name: Clone and update dotfiles using GitHub CLI authentication
  ansible.builtin.import_tasks: dotfiles-gh.yml
  when: dotfiles_clone_with_gh | default(false)
  tags:
    - install
    - dotfiles
    - stow
- name: Stow dotfiles
  ansible.builtin.command:
    argv:
      - "./{{ dotfiles_installer | default('mac') }}"
    chdir: "{{ lookup('env', 'HOME') }}/.dotfiles"
  tags:
    - install
    - dotfiles
    - stow
