---
- name: Install ZSH
  become: true
  ansible.builtin.apt:
    name: zsh
    state: present
  tags: &zsh_tags [install, productivity, dotfiles, zsh]

- name: Change shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  tags: *zsh_tags

- name: Install Oh-My-Zsh without an interactive installer
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
    depth: 1
    update: false
  tags: *zsh_tags

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/plugins/zsh-autosuggestions"
    update: false
  tags: *zsh_tags
