---
- name: Install ZSH
  become: true
  ansible.builtin.apt:
    name: zsh
    state: present
  tags: &zsh_tags [install, productivity, dotfiles, zsh]

- name: Change shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  tags: *zsh_tags

- name: Install Oh-My-Zsh without overwriting existing files
  ansible.builtin.include_tasks:
    file: mint-zsh-component.yml
    apply:
      tags: [install, productivity, dotfiles, zsh]
  vars:
    mint_zsh_destination: "{{ lookup('env', 'HOME') }}/.oh-my-zsh"
    mint_zsh_repository: https://github.com/ohmyzsh/ohmyzsh.git
    mint_zsh_marker: oh-my-zsh.sh
  tags: *zsh_tags

- name: Install zsh-autosuggestions without overwriting existing files
  ansible.builtin.include_tasks:
    file: mint-zsh-component.yml
    apply:
      tags: [install, productivity, dotfiles, zsh]
  vars:
    mint_zsh_destination: "{{ lookup('env', 'HOME') }}/.oh-my-zsh/plugins/zsh-autosuggestions"
    mint_zsh_repository: https://github.com/zsh-users/zsh-autosuggestions.git
    mint_zsh_marker: zsh-autosuggestions.zsh
  tags: *zsh_tags
