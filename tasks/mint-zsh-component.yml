---
# Called with mint_zsh_destination, mint_zsh_repository and mint_zsh_marker.
- name: Check for an installed Zsh component framework
  ansible.builtin.stat:
    path: "{{ mint_zsh_destination }}/{{ mint_zsh_marker }}"
  register: mint_oh_my_zsh

- name: Install missing Zsh component framework files safely
  when:
    - not (mint_oh_my_zsh.stat.isreg | default(false))
    - not ansible_check_mode
  block:
    - name: Create temporary framework checkout directory
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-oh-my-zsh-
      register: mint_oh_my_zsh_temp

    - name: Fetch Zsh component into the temporary directory
      ansible.builtin.git:
        repo: "{{ mint_zsh_repository }}"
        dest: "{{ mint_oh_my_zsh_temp.path }}/framework"
        depth: 1

    - name: List framework files without Git metadata
      ansible.builtin.find:
        paths: "{{ mint_oh_my_zsh_temp.path }}/framework"
        hidden: true
        file_type: any
        recurse: true
        excludes: .git
      register: mint_oh_my_zsh_files

    - name: Ensure framework directory exists
      ansible.builtin.file:
        path: "{{ mint_zsh_destination }}"
        state: directory
        mode: '0755'

    - name: Ensure framework subdirectories exist
      ansible.builtin.file:
        path: "{{ mint_zsh_destination }}/{{ item.path | relpath(mint_oh_my_zsh_temp.path + '/framework') }}"
        state: directory
      loop: "{{ mint_oh_my_zsh_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - item.isdir
        - "'/.git/' not in item.path"

    - name: Copy missing framework files while preserving existing files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ mint_zsh_destination }}/{{ item.path | relpath(mint_oh_my_zsh_temp.path + '/framework') }}"
        remote_src: true
        force: false
        mode: preserve
      loop: "{{ mint_oh_my_zsh_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - not item.isdir
        - "'/.git/' not in item.path"
  always:
    - name: Remove temporary framework checkout
      ansible.builtin.file:
        path: "{{ mint_oh_my_zsh_temp.path }}"
        state: absent
      when: mint_oh_my_zsh_temp.path is defined

- name: Preview missing framework installation
  ansible.builtin.debug:
    msg: Missing Zsh component files would be installed without overwriting existing files.
  when:
    - not (mint_oh_my_zsh.stat.isreg | default(false))
    - ansible_check_mode

